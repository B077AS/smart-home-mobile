<div class="home-wrapper">
  <div class="header">
    <div class="header-content">
      <div class="header-left">
        <button class="back-btn" id="bulbs-back-btn" title="Back">
          <i class="mdi mdi-arrow-left"></i>
        </button>
        <div class="header-text">
          <h1>Bulbs</h1>
        </div>
      </div>
      <div class="header-right">
        <button class="refresh-btn" id="bulbs-select-btn" title="Select Multiple">
          <i class="mdi mdi-checkbox-multiple-marked-outline"></i>
        </button>
        <button class="refresh-btn" id="manage-presets-btn" title="Manage Presets">
          <i class="mdi mdi-palette-swatch-outline"></i>
        </button>
        <button class="refresh-btn" id="bulbs-refresh-btn" title="Refresh">
          <i class="mdi mdi-refresh"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="main-content" id="bulbs-main-content">
    <div class="scroll-inner">
      <div id="bulbs-message-container"></div>

      <div class="selection-bar hidden" id="bulbs-selection-bar">
        <span class="selection-count" id="bulbs-selection-count">Select lights</span>
        <div class="selection-actions">
          <button class="icon-btn" id="selection-power-on-btn" title="Turn On" disabled>
            <i class="mdi mdi-power"></i>
          </button>
          <button class="icon-btn" id="selection-power-off-btn" title="Turn Off" disabled>
            <i class="mdi mdi-power-plug-off"></i>
          </button>
          <button class="icon-btn" id="selection-adjust-btn" title="Color & Brightness" disabled>
            <i class="mdi mdi-palette"></i>
          </button>
          <button class="icon-btn" id="selection-preset-btn" title="Apply Preset" disabled>
            <i class="mdi mdi-palette-swatch"></i>
          </button>
        </div>
      </div>

      <div class="section-label">Lights</div>
      <div class="device-list" id="bulbs-device-list"></div>
    </div>
  </div>

  <div class="modal-overlay" id="preset-name-overlay">
    <div class="modal-panel">
      <div class="modal-panel-header">
        <span>Save Preset</span>
        <button class="modal-close-btn" id="preset-name-close-btn">
          <i class="mdi mdi-close"></i>
        </button>
      </div>
      <div class="modal-panel-body">
        <div class="input-group">
          <label for="preset-name-input">Preset name</label>
          <div class="input-wrapper">
            <input type="text" id="preset-name-input" placeholder="e.g. Warm White" maxlength="40" autocomplete="off" />
          </div>
        </div>
        <button class="btn btn-primary modal-confirm-btn" id="preset-name-confirm-btn">
          <i class="mdi mdi-content-save"></i>
          <span>Save Preset</span>
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="preset-picker-overlay">
    <div class="modal-panel modal-panel-list">
      <div class="modal-panel-header">
        <span id="preset-picker-title">Presets</span>
        <button class="modal-close-btn" id="preset-picker-close-btn">
          <i class="mdi mdi-close"></i>
        </button>
      </div>
      <div class="modal-scroll-list" id="preset-picker-list"></div>
      <div class="empty-state hidden" id="preset-picker-empty-state">
        <i class="mdi mdi-palette-swatch-outline"></i>
        <span>No presets yet — save one from a bulb first.</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="bulb-details-overlay">
    <div class="modal-panel modal-panel-list">
      <div class="modal-panel-header">
        <span id="bulb-details-title">Details</span>
        <button class="modal-close-btn" id="bulb-details-close-btn">
          <i class="mdi mdi-close"></i>
        </button>
      </div>
      <div class="info-list modal-scroll-list" id="bulb-details-list"></div>
    </div>
  </div>

  <div class="modal-overlay" id="light-control-overlay">
    <div class="modal-panel">
      <div class="modal-panel-header">
        <span id="light-control-title">Light</span>
        <button class="modal-close-btn" id="light-control-close-btn">
          <i class="mdi mdi-close"></i>
        </button>
      </div>
      <div class="modal-panel-body">
        <div class="control-row">
          <div class="control-label"><i class="mdi mdi-brightness-6"></i><span>Brightness</span></div>
          <span class="control-value" id="light-control-brightness-value">100%</span>
        </div>
        <input type="range" class="range-slider brightness-slider" id="light-control-brightness-slider" min="1" max="100" value="100" />

        <div class="mode-toggle" id="light-control-mode-toggle">
          <button type="button" class="mode-toggle-btn active" data-mode="color">
            <i class="mdi mdi-palette"></i><span>Color</span>
          </button>
          <button type="button" class="mode-toggle-btn" data-mode="white">
            <i class="mdi mdi-white-balance-sunny"></i><span>White</span>
          </button>
        </div>

        <div class="color-picker-row" id="light-control-color-row">
          <div class="color-wheel-wrap" id="light-control-wheel-wrap">
            <canvas id="light-control-color-wheel" width="220" height="220"></canvas>
            <div class="wheel-cursor" id="light-control-wheel-cursor"></div>
          </div>
          <div class="control-row">
            <span class="control-label"><i class="mdi mdi-eyedropper-variant"></i><span>Color</span></span>
            <span class="control-value" id="light-control-color-hex">#FFFFFF</span>
          </div>
        </div>

        <div class="color-temp-row hidden" id="light-control-temp-row">
          <div class="control-row">
            <div class="control-label"><i class="mdi mdi-thermometer"></i><span>White Temp</span></div>
            <span class="control-value" id="light-control-temp-value">4000K</span>
          </div>
          <input type="range" class="range-slider color-temp-slider" id="light-control-temp-slider" min="2000" max="6500" step="50" value="4000" />
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirm-delete-overlay">
    <div class="modal-panel">
      <div class="modal-panel-header">
        <span>Delete Preset?</span>
        <button class="modal-close-btn" id="confirm-delete-close-btn">
          <i class="mdi mdi-close"></i>
        </button>
      </div>
      <div class="modal-panel-body">
        <p class="confirm-message" id="confirm-delete-message">Delete this preset? This can't be undone.</p>
        <div class="confirm-actions">
          <button class="btn btn-secondary" id="confirm-delete-cancel-btn">Cancel</button>
          <button class="btn btn-danger" id="confirm-delete-confirm-btn">
            <i class="mdi mdi-trash-can-outline"></i>
            <span>Delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
